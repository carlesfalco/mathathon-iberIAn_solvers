[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-fast-algorithms"
version = "0.2.0"
description = "Readable hierarchical matrix examples, recursive skeletonization and butterfly factorizations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
unified-showcase = "unified.showcase.reproduce:console_cli"

[tool.setuptools.packages.find]
include = ["unified*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.png", "*.md", "*.txt"]
