[package]
name = "unified-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Small, tested hierarchical compression examples inspired by the Python unified package"
license = "MIT"

[lib]
name = "unified_rs"
path = "src/lib.rs"

[dependencies]
nalgebra = "0.34"
num-complex = "0.4"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["core-prototype/rust"]
default-members = ["."]

[profile.release]
opt-level = 3
